; =====================================================================
;  Modèle de configuration de Mon Toolkit
;  Au premier lancement, ce fichier est copié en config.ini :
;  c'est config.ini que tu modifies (il reste sur ton PC, jamais sur GitHub).
; =====================================================================

[Raccourcis]
; Format :  raccourci=texte   (tu tapes ;raccourci et il devient le texte)
; Écris \n pour un retour à la ligne.
mail=prenom.nom@gmail.com
ecole=prenom.nom@ecole.fr
nom=Prénom Nom
cordia=Cordialement,\nPrénom Nom
tel=06 00 00 00 00

[Barre]
; Barre de luminosité posée sur la barre des tâches.
; position=auto      juste à gauche des icônes en bas à droite (par défaut)
; position=gauche    tout à gauche de la barre des tâches
; position=400       à 400 pixels du bord droit (pour ajuster à la main)
position=auto
